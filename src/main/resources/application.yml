spring:
  application:
    name: gamification
  h2:
    console:
      enabled: true
  datasource:
    # Enabling the server mode in H2 to connect from multiple instances
    url: jdbc:h2:file:C:/Temp/gamification;AUTO_SERVER=TRUE;
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
# cors:
#  allowed-origins: http://localhost:4200
server:
    port: 8081
    error:
        include-message: always
        include-binding-errors: always
amqp:
  exchange:
    attempts: attempts.topic
  queue:
    gamification: gamification.queue
logging:
  level:
    org.springframework.amqp.rabbit.core.RabbitAdmin: DEBUG